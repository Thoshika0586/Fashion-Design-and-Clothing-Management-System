<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Design & Clothing Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="eyebrow">Lumina Lable</div>
        <h2>Create your account</h2>
        <div class="form-error" id="formError"></div>
        <form id="registerForm">
            <div class="field">
                <label>Full name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="tel" id="phone" required placeholder="07XXXXXXXX">
            </div>
            <div class="field">
                <label>Delivery address</label>
                <input type="text" id="address" required placeholder="Enter your address">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create an account</button>
        </form>
        <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
</div>

<footer class="site-footer">Lumina Lable | Wear Your Story</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
renderNavbar('register');
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("formError");
    errorBox.classList.remove("show");
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const password = document.getElementById("password").value;
    try {
        const user = await Api.register(name, email, password, phone, address);
        saveSession(user);
        window.location.href = "customer-dashboard.html";
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
    }
});
</script>
</body>
</html>
